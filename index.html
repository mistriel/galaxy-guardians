<!DOCTYPE html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>שומרי הגלקסיה</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      html, body { margin: 0; background: #070b16; color: #eef5fb; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="vignette"></div>
    <div id="world-fade"></div>
    <div id="hurt"></div>
    <div id="crosshair" hidden>
      <span></span><span></span><span></span><span></span>
    </div>
    <div id="ui">
      <header id="hud" hidden>
        <div class="meters">
          <p id="hud-ship" class="hud-ship"></p>
          <div class="meter">
            <span id="hull-label"></span>
            <div class="track"><div id="hull-bar"></div></div>
          </div>
          <div class="meter">
            <span id="shield-label"></span>
            <div class="track"><div id="shield-bar"></div></div>
          </div>
          <div class="hud-actions">
            <button id="giant-btn" type="button"></button>
            <button id="nuke-btn" type="button"></button>
            <button id="ordnance-cycle" type="button"></button>
            <button id="ordnance-btn" type="button"></button>
            <button id="boost-btn" type="button"></button>
            <button id="pause-btn" class="tiny" type="button"></button>
            <button id="mute-btn" class="tiny" type="button"></button>
          </div>
        </div>
        <div class="stats">
          <div>
            <span id="wave-label" class="label"></span>
            <strong id="wave" dir="ltr">0</strong>
          </div>
          <div>
            <span id="score-label" class="label"></span>
            <strong id="score" dir="ltr">0</strong>
          </div>
          <div id="combo"></div>
        </div>
      </header>
      <div id="flight-row">
        <span id="weapon"></span>
        <span id="flight"></span>
      </div>
      <canvas id="radar" width="180" height="180" hidden></canvas>
      <div id="banner"></div>
      <div id="toast"></div>
      <div id="edge"></div>
      <div id="touch" hidden>
        <div id="move-stick" class="joy">
          <div class="stick-base"></div>
          <div class="stick-knob"></div>
        </div>
        <div id="aim-stick" class="joy">
          <div class="stick-base"></div>
          <div class="stick-knob"></div>
        </div>
        <button id="giant-touch" type="button"></button>
        <button id="ordnance-cycle-touch" type="button"></button>
        <button id="ordnance-touch" type="button"></button>
        <button id="missile-btn" type="button"></button>
        <button id="boost-touch" type="button"></button>
        <button id="fire-btn" type="button"></button>
      </div>
      <section id="menu">
        <div class="card">
          <div class="hero">
            <p id="sector" class="kicker"></p>
            <h1 id="title"></h1>
            <p id="subtitle" class="subtitle"></p>
            <p id="ship-name"></p>
            <p id="tagline" class="tagline"></p>
            <p id="goal" class="goal"></p>
            <p id="roster" class="goal"></p>
            <div class="menu-actions">
              <button id="start-btn" class="primary" type="button"></button>
              <button id="ground-menu-btn" class="primary battle" type="button"></button>
              <button id="open-forest" class="ghost world-open" type="button" data-world="forest"></button>
              <button id="open-desert" class="ghost world-open" type="button" data-world="desert"></button>
              <button id="menu-mute" class="ghost" type="button"></button>
              <span id="menu-best"></span>
            </div>
            <div id="hangar">
              <h2 id="hangar-title"></h2>
              <p id="meta-points"></p>
              <h2 id="ship-picker-title"></h2>
              <div id="ship-picks" class="picks"></div>
              <div id="weapon-picks" class="picks"></div>
            </div>
          </div>
          <div class="help">
            <h2 id="controls-title"></h2>
            <ul id="controls"></ul>
          </div>
        </div>
      </section>
      <section id="ground-pick" hidden>
        <div class="overlay-card ground-card">
          <h2 id="ground-title"></h2>
          <p id="ground-blurb" class="goal"></p>
          <div id="ground-worlds"></div>
          <button id="ground-close" class="ghost" type="button"></button>
        </div>
      </section>
      <div id="ground-hud" hidden>
        <div class="ground-top">
          <p id="ground-world" class="kicker"></p>
          <p id="ground-phase"></p>
          <p id="ground-note"></p>
          <div class="meter">
            <span id="ground-hold-label"></span>
            <div class="track"><div id="ground-hold-bar"></div></div>
          </div>
          <div class="meter">
            <span id="ground-capture-label"></span>
            <div class="track"><div id="ground-capture-bar"></div></div>
          </div>
        </div>
        <div class="ground-actions">
          <div class="deploy-row">
            <button id="ground-soldier" class="primary deploy" type="button"></button>
            <button id="ground-tank" class="primary deploy" type="button"></button>
            <button id="ground-destroyer" class="primary deploy" type="button"></button>
          </div>
          <div class="deploy-row">
            <button id="ground-retreat" class="ghost" type="button"></button>
            <button id="ground-back" class="ghost" type="button"></button>
            <button id="ground-space" class="ghost" type="button"></button>
          </div>
        </div>
      </div>
      <div id="ground-touch" hidden>
        <button id="ground-left" type="button"></button>
        <button id="ground-right" type="button"></button>
      </div>
      <section id="overlay" hidden>
        <div class="overlay-card">
          <h2 id="overlay-title"></h2>
          <div id="overlay-body"></div>
          <div class="overlay-actions">
            <button id="resume-btn" class="primary" type="button"></button>
            <button id="restart-btn" class="ghost" type="button"></button>
            <button id="menu-btn" class="ghost" type="button"></button>
          </div>
        </div>
      </section>
    </div>
    <div id="popups"></div>
    <div id="boot-error" hidden>הדפדפן לא הצליח לפתוח גרפיקת תלת־ממד.</div>
    <script>
      document.addEventListener('error', (event) => {
        const target = event.target;
        if (!(target instanceof HTMLScriptElement) || target.type !== 'module') return;
        const box = document.querySelector('#boot-error');
        if (!box) return;
        box.hidden = false;
      }, true);
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
